<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourNovelLibrary</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="YourNovelLibrary.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <script>
                    const novelStartupStartedAt = performance.now();

                    window.finishNovelStartup = async function () {
                        const elapsed = performance.now() - novelStartupStartedAt;
                        const remaining = Math.max(0, 1000 - elapsed);

                        await new Promise(resolve => setTimeout(resolve, remaining));

                        document.getElementById('startup-screen')?.remove();
                    };
    </script>

    <div id="startup-screen" class="startup-screen"
         role="status" aria-live="polite">
        <div class="startup-brand">
            <h1>Your Novel<br /><span>Library</span></h1>

            <div class="startup-loader" aria-hidden="true"></div>
            <p class="startup-hint">Открываем библиотеку…</p>
        </div>

        <footer class="startup-footer">
            <span>Версия 0.1.0</span>
            <span>Разработчик: sveta0ka</span>
        </footer>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/projectFiles.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
